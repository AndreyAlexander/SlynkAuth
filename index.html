<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/login-slynk.js" defer></script>
    <link rel="icon" type="image/x-icon" href="img/logo-icon/logo-slynk.png">
    <title>Slynk Login</title>
</head>
<body>
    <main class="container">
        <form novalidate>
            <h1>Login Slynk</h1>
            <div class="input-box">
                <input id="email" name="email" placeholder="E-mail" type="email" autocomplete="username" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input id="senha" name="senha" placeholder="Senha" type="password" autocomplete="current-password" required minlength="6">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar minha senha
                </label>
                <a href="mailto:suporte@slynk.com?subject=Redefinição%20de%20senha">Esqueci a senha</a>
            </div>

            <button type="submit" class="login">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="mailto:suporte@slynk.com?subject=Cadastro%20Slynk">Cadastre-se</a></p>
            </div>
        </form>

    </main>
    
</body>
</html>
